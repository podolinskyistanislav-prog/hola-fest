<!doctype html>
<!-- Approved mockup: Clubs map. Canvas 390x844. The drawn streets stand in for the real dark map
     (react-native-maps on iOS/Android). Open in a browser to view. -->
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Карта клубів</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 390px;
        height: 844px;
        position: relative;
        overflow: hidden;
        background: #0b0b0c;
        color: #ffffff;
        font-family: Inter, system-ui, sans-serif;
      "
    >
      <svg
        width="390"
        height="844"
        viewBox="0 0 390 844"
        style="position: absolute; left: 0; top: 0"
      >
        <path
          d="M300 0C320 120 280 220 330 330C370 420 340 560 390 640L390 0Z"
          fill="#0F1C26"
        ></path>
        <path
          d="M300 0C320 120 280 220 330 330C370 420 340 560 390 640"
          fill="none"
          stroke="#16303F"
          stroke-width="2"
        ></path>
        <path
          d="M0 140L390 90M0 260L300 220M0 380L340 350M0 500L360 470M0 640L390 600M0 760L390 730"
          stroke="#1C1C20"
          stroke-width="10"
          fill="none"
        ></path>
        <path
          d="M60 0L90 844M160 0L150 844M240 0L230 844"
          stroke="#1C1C20"
          stroke-width="10"
          fill="none"
        ></path>
        <path
          d="M0 320C90 300 170 330 260 290M120 844C130 700 160 600 250 300"
          stroke="#2A2A30"
          stroke-width="14"
          fill="none"
          stroke-linecap="round"
        ></path>
      </svg>

      <!-- Glass search field. -->
      <div
        style="
          position: absolute;
          left: 20px;
          right: 20px;
          top: 60px;
          height: 52px;
          border-radius: 26px;
          padding: 0 18px;
          display: flex;
          align-items: center;
          gap: 10px;
          background: rgba(28, 28, 30, 0.55);
          backdrop-filter: blur(28px) saturate(200%);
          border: 1px solid rgba(255, 255, 255, 0.16);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        "
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#A1A1AA"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input
          aria-label="Пошук клубу"
          placeholder="Клуби поруч"
          style="
            flex: 1;
            border: 0;
            outline: 0;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
          "
        />
      </div>

      <!-- Pins: name label pill above a dot with halo. Each venue has its accent (pink / yellow). Selected venue = pink. -->
      <div
        style="
          position: absolute;
          left: 226px;
          top: 262px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        "
      >
        <span
          style="
            height: 28px;
            padding: 0 10px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            background: #f1277d;
            color: #000000;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
          "
          >Panorama Bar</span
        >
        <span
          style="
            width: 16px;
            height: 16px;
            border-radius: 8px;
            background: #f1277d;
            border: 3px solid #000000;
            box-shadow: 0 0 0 6px rgba(241, 39, 125, 0.25);
          "
        ></span>
      </div>
      <div
        style="
          position: absolute;
          left: 92px;
          top: 520px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        "
      >
        <span
          style="
            height: 28px;
            padding: 0 10px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            background: #fdd303;
            color: #000000;
            font-size: 12px;
            font-weight: 600;
          "
          >Bavovna</span
        >
        <span
          style="
            width: 16px;
            height: 16px;
            border-radius: 8px;
            background: #fdd303;
            border: 3px solid #000000;
            box-shadow: 0 0 0 6px rgba(253, 211, 3, 0.25);
          "
        ></span>
      </div>

      <!-- Glass venue card for the selected pin: thumb, name, address, today's event, buttons "Подія" + "Поїхати". -->
      <div
        style="
          position: absolute;
          left: 20px;
          right: 20px;
          bottom: 116px;
          border-radius: 30px;
          padding: 18px;
          display: flex;
          flex-direction: column;
          gap: 14px;
          background: rgba(28, 28, 30, 0.6);
          backdrop-filter: blur(30px) saturate(200%);
          border: 1px solid rgba(255, 255, 255, 0.16);
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.22),
            0 10px 30px rgba(0, 0, 0, 0.45);
        "
      >
        <div style="display: flex; align-items: center; gap: 12px">
          <div
            style="
              width: 52px;
              height: 52px;
              border-radius: 16px;
              background: #f1277d;
              flex-shrink: 0;
              position: relative;
              overflow: hidden;
            "
          >
            <svg
              width="40"
              height="40"
              viewBox="0 0 100 100"
              style="position: absolute; left: 6px; top: 6px"
            >
              <path
                d="M50 0C55 35 65 45 100 50C65 55 55 65 50 100C45 65 35 55 0 50C35 45 45 35 50 0Z"
                fill="#FDD303"
              ></path>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-family: Unbounded, sans-serif; font-weight: 500; font-size: 17px"
              >Panorama Bar</span
            >
            <span style="font-size: 13px; color: #a1a1aa">вул. Хрещатик, 1/2</span>
            <span style="font-size: 13px; color: #e4e4e7">Сьогодні: Rooftop Sunset · 19:00</span>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <a
            href="Event.html"
            style="
              flex: 1;
              height: 46px;
              border-radius: 23px;
              background: #fdd303;
              color: #000000;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
              font-weight: 600;
              font-size: 15px;
            "
            >Подія</a
          >
          <button
            style="
              flex: 1;
              height: 46px;
              border-radius: 23px;
              border: 1px solid rgba(255, 255, 255, 0.18);
              background: rgba(255, 255, 255, 0.1);
              color: #ffffff;
              font-weight: 600;
              font-size: 15px;
            "
          >
            Поїхати
          </button>
        </div>
      </div>

      <!-- Same floating tab bar as Main.html, "Карта" active. -->
      <nav
        style="
          position: absolute;
          left: 20px;
          right: 20px;
          bottom: 30px;
          height: 68px;
          border-radius: 34px;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          align-items: center;
          padding: 0 8px;
          background: rgba(28, 28, 30, 0.55);
          backdrop-filter: blur(28px) saturate(200%);
          border: 1px solid rgba(255, 255, 255, 0.16);
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.22),
            0 10px 30px rgba(0, 0, 0, 0.4);
        "
      >
        <a
          href="Main.html"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #d4d4d8;
            font-size: 11px;
            font-weight: 500;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="17" rx="3"></rect>
            <path d="M3 9h18M8 2v4M16 2v4"></path>
          </svg>
          Події
        </a>
        <a
          href="Map.html"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #fdd303;
            font-size: 11px;
            font-weight: 600;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path>
            <circle cx="12" cy="9" r="2.5"></circle>
          </svg>
          Карта
        </a>
        <a
          href="Offer.html"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #d4d4d8;
            font-size: 11px;
            font-weight: 500;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <path d="M14 14h3v3M21 14v7h-7"></path>
          </svg>
          Мої QR
        </a>
      </nav>
    </div>
  </body>
</html>
