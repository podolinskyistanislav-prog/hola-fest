name: Agents

# The agent team running in GitHub:
# - label an issue agent:db / agent:mobile / agent:qa / agent:orchestrator → that agent picks it up
# - every PR from a branch → reviewer + security-qa post their verdicts
# - write "@claude ..." in any issue/PR comment → ad-hoc help
#
# Requires the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` once).

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  work-on-issue:
    # Starts when an issue gets an agent:* label or status:todo (e.g. unblocked by the
    # orchestrator) — but only if it has an owner and is not blocked. Several label events
    # at once (agent:db + status:todo on creation) collapse into one run via concurrency.
    if: >
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      (startsWith(github.event.label.name, 'agent:') || github.event.label.name == 'status:todo') &&
      contains(join(github.event.issue.labels.*.name, ','), 'agent:') &&
      !contains(github.event.issue.labels.*.name, 'status:blocked')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install graphifyy && graphify update .
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Agents create issues/PRs as the claude bot; let those events start other agents.
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}

            Find the issue's agent:* label and map it to an agent: agent:orchestrator → orchestrator, agent:db → db-backend,
            agent:mobile → mobile, agent:qa → security-qa. Act strictly as that agent, following
            its file in .claude/agents/, CLAUDE.md and docs/WORKFLOW.md.

            Read the issue with `gh issue view ${{ github.event.issue.number }}`.
            If it is blocked by an open issue, comment that and stop.
            Otherwise do the work.

            Database work: a real local Supabase is available. Run `supabase start`, then
            `supabase db reset` (applies all migrations) and `supabase test db` (pgTAP tests).
            Generate types with `supabase gen types typescript --local > src/types/database.ts`
            and run `npx prettier --write src/types/database.ts`. Never hand-write generated types.
            Do not say "done" unless migrations apply and all DB tests pass.

            Finish: commit, push, and OPEN THE PULL REQUEST YOURSELF with
            `gh pr create --base main --title "..." --body "Closes #${{ github.event.issue.number }} ..."`
            (do not just post a "Create PR" link). Then set the issue label to status:review.
            The orchestrator creates issues instead of a PR.
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Task,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(graphify:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(node:*),Bash(supabase:*),Bash(docker:*)"

  review-pr:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build graph for main and for this PR
        run: |
          pip install graphifyy
          git worktree add /tmp/main origin/main
          (cd /tmp/main && graphify update . >/dev/null) || true
          graphify update .
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Run two independent reviews of this PR, using the subagents defined in .claude/agents/:
            1. the `reviewer` agent,
            2. the `security-qa` agent (review mode).
            Each posts its own verdict comment as its agent file describes.
            The graph of main is at /tmp/main/graphify-out/GRAPH_REPORT.md, the PR's graph at
            graphify-out/GRAPH_REPORT.md — the reviewer compares them.
            Do not edit any files.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,Task,Bash(gh pr:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(graphify:*),Bash(diff:*),Bash(cat:*)"

  after-merge:
    # When the founder merges a PR, the orchestrator unblocks the next tasks
    # and writes a short progress note — this is what keeps the chain moving.
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agent-after-merge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            MERGED PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

            Act as the orchestrator (.claude/agents/orchestrator.md).
            1. Find the issues this PR closed.
            2. For every open issue labelled status:blocked whose "Blocked by" issues are now all
               closed: remove status:blocked, then add status:todo (this starts its agent).
               Do these as two separate gh calls.
            3. Post a short progress comment in Ukrainian on the parent milestone issue:
               what was merged, what started now, what needs the founder.
            Do not edit any files.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*)"

  mention:
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Task,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(graphify:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(node:*),Bash(supabase:*),Bash(docker:*)"
