name: Agents

# The agent team running in GitHub:
# - label an issue agent:db / agent:mobile / agent:qa / agent:orchestrator → that agent picks it up
# - every PR from a branch → reviewer + security-qa post their verdicts
# - write "@claude ..." in any issue/PR comment → ad-hoc help
#
# Requires the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` once).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number for an agent to work on (used by the queue)'
        required: true
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write
  checks: read

jobs:
  work-on-issue:
    # Starts when an issue gets an agent:* label or status:todo (e.g. unblocked by the
    # orchestrator) — but only if it has an owner and is not blocked. Several label events
    # at once (agent:db + status:todo on creation) collapse into one run via concurrency.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      (startsWith(github.event.label.name, 'agent:') || github.event.label.name == 'status:todo') &&
      contains(join(github.event.issue.labels.*.name, ','), 'agent:') &&
      !contains(github.event.issue.labels.*.name, 'status:blocked') &&
      !contains(github.event.issue.labels.*.name, 'status:queued')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    concurrency:
      group: agent-issue-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install graphifyy && graphify update .
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Mark issue in progress
        if: ${{ !contains(github.event.issue.labels.*.name, 'agent:orchestrator') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" --add-label status:in-progress --remove-label status:todo
      - name: Agent
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: ${{ github.event_name == 'issues' }}
          # Private repo: show the agent's output in the run log, so a silent stop can be diagnosed.
          show_full_output: true
          # Agents create issues/PRs as the claude bot; let those events start other agents.
          allowed_bots: 'claude,github-actions'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ env.ISSUE }}

            Read the issue and its labels with `gh issue view ${{ env.ISSUE }}`. Find its agent:* label and map it to an agent: agent:orchestrator → orchestrator, agent:db → db-backend,
            agent:mobile → mobile, agent:ui → ui-ux, agent:qa → security-qa. Act strictly as that agent, following
            its file in .claude/agents/, CLAUDE.md and docs/WORKFLOW.md.

                        If it is blocked by an open issue, comment that and stop.
            If you cannot finish without a decision, secret or paid service from the founder:
            ask ONE clear question in a comment, set the label status:needs-founder and stop.
            Otherwise do the work.

            You run headless: nobody will answer and no notification will ever arrive.
            Run every command in the FOREGROUND and wait for it to finish (no `&`, no background
            tasks, no monitors). Never end your turn while waiting for something.

            Database work: a real local Supabase is available. Run `supabase start`, then
            `supabase db reset` (applies all migrations) and `supabase test db` (pgTAP tests).
            Generate types with `supabase gen types typescript --local > src/types/database.ts`
            and run `npx prettier --write src/types/database.ts`. Never hand-write generated types.
            Do not say "done" unless migrations apply and all DB tests pass.

            Finish: commit, push, and OPEN THE PULL REQUEST YOURSELF with
            `gh pr create --base main --title "..." --body "Closes #${{ env.ISSUE }} ..."`
            (do not just post a "Create PR" link). Then set the issue label to status:review.
            The orchestrator creates issues instead of a PR.
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Task,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(graphify:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(node:*),Bash(supabase:*),Bash(docker:*)"

      - name: Flag a run that ended without a PR
        if: ${{ success() && !contains(github.event.issue.labels.*.name, 'agent:orchestrator') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh issue view "$ISSUE" --json labels,state --jq 'select(.state=="OPEN") | [.labels[].name] | join(",")')
          case ",$labels," in *",status:in-progress,"*) ;; *) exit 0 ;; esac
          prs=$(gh pr list --state open --search "$ISSUE in:body" --json number,body,headRefName \
            --jq "[.[] | select((.body|test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) #$ISSUE\\\\b\")) or (.headRefName|test(\"issue-$ISSUE-\")))] | length")
          if [ "${prs:-0}" = "0" ]; then
            gh issue edit "$ISSUE" --add-label status:needs-founder --remove-label status:in-progress
            gh issue comment "$ISSUE" --body "Агент завершив роботу без PR і без пояснення: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Позначено status:needs-founder, черга йде далі. Щоб перезапустити, прибери цю мітку й постав status:queued."
            gh workflow run queue.yml
          fi
      - name: Flag failed run
        if: ${{ failure() && !contains(github.event.issue.labels.*.name, 'agent:orchestrator') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE" --add-label status:needs-founder --remove-label status:in-progress
          gh issue comment "$ISSUE" --body "Агент не завершив задачу: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Позначено status:needs-founder. Щоб перезапустити, прибери цю мітку й постав status:queued."
          gh workflow run queue.yml

  sync-status:
    # Deterministic status bookkeeping: an open PR marks its issues status:review.
    # Uses GITHUB_TOKEN, so these label changes never start agents.
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          nums=$( { printf '%s\n' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+'; \
                    printf '%s\n' "$BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+'; } | sort -u)
          for n in $nums; do
            gh issue edit "$n" --repo "${{ github.repository }}" --add-label status:review \
              --remove-label status:in-progress --remove-label status:todo --remove-label status:blocked || true
          done

  review-pr:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build graph for main and for this PR
        run: |
          pip install graphifyy
          git worktree add /tmp/main origin/main
          (cd /tmp/main && graphify update . >/dev/null) || true
          graphify update .
          mkdir -p .review && cp /tmp/main/graphify-out/GRAPH_REPORT.md .review/GRAPH_REPORT.main.md || true
      - name: Does this PR touch UI?
        id: ui
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(src/(app|features|components|theme)/|docs/DESIGN.md)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Code review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Read .claude/agents/reviewer.md and act strictly as that agent, in review mode.
            Compare .review/GRAPH_REPORT.main.md (main) with graphify-out/GRAPH_REPORT.md (this PR). Check CI with `gh pr checks ${{ github.event.pull_request.number }}`.
            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the linked issue.
            Run shell commands one at a time (no pipes or `&&`).
            Post exactly one verdict with
            `gh pr review ${{ github.event.pull_request.number }} --comment --body "<verdict>"`
            where the body starts with `APPROVE` or `CHANGES REQUESTED`, headed `## Code review`.
            CI status may be unreadable for you ('Resource not accessible by integration').
            Then do NOT block on it: write "CI: not visible to reviewer" and judge the code. The founder checks CI.
            Do not edit, commit or push anything.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(graphify:*),Bash(diff:*),Bash(cat:*),Bash(ls:*)"
      - name: Security review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Read .claude/agents/security-qa.md and act strictly as that agent, in review mode.
            Focus on RLS, grants, secrets and anything a user could cheat.
            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the linked issue.
            Run shell commands one at a time (no pipes or `&&`).
            Post exactly one verdict with
            `gh pr review ${{ github.event.pull_request.number }} --comment --body "<verdict>"`
            where the body starts with `APPROVE` or `CHANGES REQUESTED`, headed `## Security review`.
            CI status may be unreadable for you ('Resource not accessible by integration').
            Then do NOT block on it: write "CI: not visible to reviewer" and judge the code. The founder checks CI.
            Do not edit, commit or push anything.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(graphify:*),Bash(diff:*),Bash(cat:*),Bash(ls:*)"

      - name: UI/UX review
        if: steps.ui.outputs.touched == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Read .claude/agents/ui-ux.md and act strictly as that agent, in review mode.
            Read docs/DESIGN.md and src/theme/tokens.ts, then the diff with
            `gh pr diff ${{ github.event.pull_request.number }}` and the linked issue.
            Run shell commands one at a time (no pipes or `&&`).
            Post exactly one verdict with
            `gh pr review ${{ github.event.pull_request.number }} --comment --body "<verdict>"`
            where the body starts with `APPROVE` or `CHANGES REQUESTED`, headed `## UI/UX review`.
            CI status may be unreadable for you ('Resource not accessible by integration').
            Then do NOT block on it: write "CI: not visible to reviewer" and judge the code. The founder checks CI.
            Do not edit, commit or push anything.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(cat:*),Bash(ls:*)"

  mention:
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install graphifyy && graphify update .
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Task,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(graphify:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(node:*),Bash(supabase:*),Bash(docker:*)"
