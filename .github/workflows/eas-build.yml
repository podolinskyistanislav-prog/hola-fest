name: App build (EAS)

# Builds the native app in Expo's cloud. Run manually:
# Actions → App build (EAS) → Run workflow.
# "preview" + android gives an installable APK link (internal distribution).
#
# Repo secrets: EXPO_TOKEN (Expo robot user), SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID.
# The Supabase URL and the public anon key are copied into EAS environment
# variables on every run, so the build always points at the real project.
# Only the anon key is read; the service_role key never leaves Supabase.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: 'Build profile (eas.json)'
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: eas-build-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets are set
        run: |
          for v in EXPO_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repo secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Install dependencies
        run: npm ci
      - name: Sync public Supabase config to EAS
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_ID}.supabase.co"
          anon=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json \
            | jq -r 'map(select(.name == "anon")) | first | .api_key // empty')
          if [ -z "$anon" ]; then echo "::error::Could not read the anon key"; exit 1; fi
          echo "::add-mask::$anon"
          for pair in "EXPO_PUBLIC_SUPABASE_URL=$url" "EXPO_PUBLIC_SUPABASE_ANON_KEY=$anon"; do
            eas env:set --name "${pair%%=*}" --value "${pair#*=}" \
              --environment "${{ inputs.profile }}" --visibility plaintext \
              --non-interactive > /dev/null
          done
          echo "Synced EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY"
      - name: Build on EAS
        run: |
          set -euo pipefail
          eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" \
            --non-interactive --json > builds.json
          jq -r '.[] | "\(.platform): \(.status) https://expo.dev/accounts/errer09s-team/projects/hola-fest/builds/\(.id)  artifact: \(.artifacts.buildUrl // "-")"' builds.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
