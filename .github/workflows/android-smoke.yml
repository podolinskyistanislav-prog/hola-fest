name: Android smoke test

# Installs an APK on an Android emulator, launches the app and prints the
# crash log, so a startup crash can be read without a phone or a cable.
# Run manually: Actions → Android smoke test → Run workflow, with the APK
# link from the "App build (EAS)" summary.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK link (expo.dev/artifacts/...)'
        required: true
      api_level:
        description: 'Android API level'
        default: '34'
  push:
    branches: [ci/android-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_URL: ${{ inputs.apk_url || 'https://expo.dev/artifacts/eas/ZNBrVaYgPqEXhgJl28mvR4nJCj_hO7NLRpM4JTM5w0g.apk' }}
      API_LEVEL: ${{ inputs.api_level || '34' }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        run: curl -fsSL -o app.apk "$APK_URL" && ls -l app.apk
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.holafest.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt || true
            echo "===== crash ====="
            grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|ReactNative|Hermes|Error|Exception" logcat.txt | grep -v -E "chatty|GnssHAL" | head -120 || true
            echo "===== process ====="
            adb shell pidof com.holafest.app || echo "app is NOT running"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore
