name: Refresh code graph on main

# After every merge, rebuild the Graphify graph and commit it,
# so every agent starts from an up-to-date map of the code.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install graphifyy
      - run: graphify update .
      - name: Commit graph if changed
        run: |
          git config user.name "graphify-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/manifest.json
          git diff --cached --quiet || git commit -m "chore(graph): refresh Graphify graph [skip ci]"
          git push
